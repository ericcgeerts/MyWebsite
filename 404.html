<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The requested page could not be found.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#f6f3ed">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <title>Page not found | Eric Connelly</title>
  <style>
    :root{--paper:#f6f3ed;--ink:#10233b;--muted:#596577;--green:#55784d;--line:#d9d6ce;--serif:Georgia,'Times New Roman',serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 15% 0,rgba(255,255,255,.92),transparent 33rem),var(--paper);font-family:var(--sans);line-height:1.55}.page{width:min(820px,calc(100% - 42px));margin:auto}.site-header{display:flex;align-items:center;justify-content:space-between;min-height:108px;border-bottom:1px solid var(--line)}.monogram{display:grid;width:49px;height:49px;place-items:center;border:1px solid var(--ink);font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.12em;text-decoration:none}.home{color:var(--green);font-family:var(--serif);font-size:17px;text-decoration-thickness:1px;text-underline-offset:7px}.content{min-height:520px;padding:95px 0 72px}.eyebrow{margin:0 0 14px;color:var(--green);font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{margin:0 0 30px;font-family:var(--serif);font-size:clamp(56px,10vw,100px);font-weight:500;letter-spacing:-.045em;line-height:.88}.intro{max-width:670px;margin:0;font-family:var(--serif);font-size:clamp(23px,3vw,34px);letter-spacing:-.02em;line-height:1.3}.return{display:inline-block;margin-top:38px;color:var(--green);font-family:var(--serif);font-size:18px;text-underline-offset:7px}@media(max-width:700px){.page{width:min(100% - 30px,820px)}.site-header{min-height:80px}.content{padding:72px 0 55px}}
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <a class="monogram" href="/" aria-label="Eric Connelly home">EC</a>
      <a class="home" href="/">Home</a>
    </header>
    <main class="content">
      <p class="eyebrow">404 error</p>
      <h1>Page not found</h1>
      <p class="intro">The page you’re looking for doesn’t exist or may have moved.</p>
      <a class="return" href="/">Return home</a>
    </main>
  </div>
</body>
</html>
